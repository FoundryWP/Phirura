[workspace]
members = [
    "phira",
    "phira-main",
    "phira-monitor",
    "prpr",
    "prpr-auto-offset",
    "prpr-avc",
    "prpr-l10n",
    "prpr-pbc",
    # The WP8.1 bridge crate. Added by the port - see prpr-port/Cargo.toml for why it is a
    # workspace member rather than a workspace of its own.
    "prpr-port",
    "tools/*",
]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(closed)'] }

[workspace.package]
version = "0.8.2"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
base64 = "0.22.1"
bitflags = "2.11.0"
chrono = "0.4.44"
fluent = "0.17.0"
fluent-syntax = "0.12.0"
futures-util = "0.3.32"
hex = "0.4.3"
http = "1"
image = { version = "0.25.10", default-features = false }
inputbox = "0.1.5"
lru = "0.16.3"
lyon = "1.0.19"

macroquad = { git = "https://github.com/Mivik/prpr-macroquad", rev = "2150130", default-features = false }
miniquad = { git = "https://github.com/Mivik/prpr-miniquad", rev = "138679c" }
nalgebra = "0.34.1"

objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-ui-kit = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
once_cell = "1.21.4"
phira = { path = "phira", default-features = false }
phira-mp-client = { git = "https://github.com/TeamFlos/phira-mp", rev = "cc822df" }
phira-mp-common = { git = "https://github.com/TeamFlos/phira-mp", rev = "cc822df" }
pollster = "0.4.0"
prpr = { path = "prpr", default-features = false }
prpr-auto-offset = { path = "prpr-auto-offset" }
prpr-avc = { path = "prpr-avc" }
prpr-l10n = { path = "prpr-l10n" }
rand = "0.8.5"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false }
rfd = "0.17.2"
sasa = { git = "https://github.com/Mivik/sasa", rev = "e76229b", default-features = false }
serde = "1.0.228"
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
sys-locale = "0.3.2"
tempfile = "3.27.0"
tokio = "1.50.0"
tracing = "0.1.44"
uuid = "1.22.0"
url = "2"
walkdir = "2.5.0"
zip = { version = "8.3.0", default-features = false }

[profile.release]
opt-level = 2
strip = true

[profile.dev.package."*"]
opt-level = 2

# ===========================================================================
# Windows Phone 8.1 port - dependency substitution.
#
# Added by the port, not by upstream. Everything below replaces a crate that cannot exist on
# WP8.1 with a shim from rust-wp81/shims/. The shims keep the API surface prpr uses and route the
# platform work to the C#/Win2D shell. See rust-wp81/README.md for why each one is needed.
#
# This is a build configuration, not a source change: no upstream file is edited. Revert by
# removing this block.
#
# `[patch]` is only honoured in a workspace root, which is why it has to live here rather than in
# the port's own manifest.
# ===========================================================================

# rfd binds the Win32 common dialogs through windows-sys, and those dialogs do not exist on
# Windows Phone 8.1 - a WP app shows `FileOpenPicker`/`FileSavePicker` instead, which the C#
# side already drives. So rfd is replaced by a shim that forwards to the shell's pickers rather
# than merely compiling.
#
# (windows-sys itself no longer fails to build: its per-architecture struct definitions omit
# `target_arch = "arm"`, which `rust-wp81/wp81_registry_patch.py` adds. That patch is what let
# `windows-sys` stop being the blocker; rfd would still have nothing to call.)
[patch.crates-io]
rfd = { path = "../../rust-wp81/shims/rfd" }

# `phira`'s entire API layer sits on reqwest, whose `rustls` feature pulls `aws-lc-sys` - a C
# library whose build script reports `No target-specific source found: windows-arm` and fails to
# compile `stdalign_check.c`. There is no source for this architecture, so the crate cannot be
# built here at all. Beyond that, the port's rule is that networking belongs to the shell: this
# shim keeps reqwest's type surface and leaves `send` unimplemented until an `http_request`
# callback exists on the C# side.
reqwest = { path = "../../rust-wp81/shims/reqwest" }

# `phira-mp-client` (multiplayer, an unconditional dependency of `phira`) resolves its
# `_phira._tcp` SRV record through `hickory-resolver`, whose default features pull
# `hickory-proto -> ring`. `ring` is a C/assembly crypto library that cannot be built for this
# target, for the same reason `aws-lc-sys` cannot. Only one file in `phira-mp-client` touches
# hickory, so replacing the resolver keeps the rest of that crate - and `phira`'s own use of its
# `Client`, `RoomId` and `ClientCommand` - exactly as upstream wrote it.
hickory-resolver = { path = "../../rust-wp81/shims/hickory-resolver" }

# `phira::censor` zstd-compresses its cached Aho-Corasick automaton, and `zstd` is a C library -
# `zstd-sys`'s build script compiles `libzstd` with `cc` and has no `thumbv7a-pc-windows-msvc`
# toolchain, for the same reason `aws-lc-sys` and `ring` fail. The shim stores rather than
# compresses: the cache is an optimisation, both ends of its format are that same shim, and the
# pure-Rust `ruzstd` can decode but not encode.
zstd = { path = "../../rust-wp81/shims/zstd" }

# macroquad and miniquad are GL-only abstractions with no D3D or Metal backend, and WP8.1 has no
# OpenGL at all. Rendering is already solved by Win2D on the C# side, so these record draw commands
# for the shell to replay instead of issuing GL calls.
[patch."https://github.com/Mivik/prpr-macroquad"]
macroquad = { path = "../../rust-wp81/shims/macroquad" }

[patch."https://github.com/Mivik/prpr-miniquad"]
miniquad = { path = "../../rust-wp81/shims/miniquad" }

# sasa's backends are cpal (desktop WASAPI), oboe (Android) and ohos-audio-sys (OpenHarmony); there
# is no WinRT or XAudio2 backend. The shell owns playback, so this keeps the API and the timing
# surface prpr judges against.
[patch."https://github.com/Mivik/sasa"]
sasa = { path = "../../rust-wp81/shims/sasa" }
