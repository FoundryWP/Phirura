# Path A, Stage 1: the Rust D3D11 renderer for Windows Phone 8.1.
#
# There are deliberately NO dependencies. The `windows` crate compiles for this target but its ABI
# plumbing (`windows-core`'s own `link!` uses) drags in import descriptors for kernel32.dll,
# oleaut32.dll, combase.dll, rpcrt4.dll, user32.dll and ntdll.dll - none of which WP8.1 has. A
# hand-rolled binding of `d3d11.dll` / `dxgi.dll` / `d3dcompiler.dll` keeps the import table to
# exactly those libraries, all three proven present by the WP8.1 kit's own ARM import libs:
# `WP Kits\8.1\lib\ARM\{d3d11,dxgi,d3dcompiler}.lib`.
#
# The `windows`-crate experiment is kept for the record under `_stage1-windows-crate-probe/`.
#
# Its own workspace on purpose, so it does not join the phira workspace / pick up the shim
# `[patch]` block.
[workspace]

[package]
name = "d3d11-rs-probe"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]

# The desktop verification harness. Host-only: `build.ps1` builds with `--lib` for the ARM/WP8.1
# target so this is never linked into the phone artifact.
[[bin]]
name = "hostcheck"
path = "src/bin/hostcheck.rs"

[dependencies]
