[package]
name = "wp81-compat"
version = "0.1.0"
edition = "2021"

[lib]
# An rlib, NOT a staticlib: this crate is a *library* that is linked into the final Rust
# artifact (prpr built as a staticlib). A staticlib is a final artifact and rustc would demand
# a `#[panic_handler]` here, which would then collide with the one std/panic_abort provides.
crate-type = ["lib"]

[dependencies]
# The C math library, for a link that has no CRT. `src/math.rs` explains why the answers come
# from here rather than from `x.ln()` - the short version is that on this target `x.ln()` *is*
# a call to `logf`, so the obvious implementation recurses forever.
#
# `no_std` like the rest of this crate, and already in the workspace lockfile at this exact
# version, so reaching for it costs no new registry bytes (the budget is ~4 MiB and shrinking).
libm = "0.2.16"

[profile.release]
opt-level = 2

[workspace]
